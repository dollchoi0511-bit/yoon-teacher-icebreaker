<header><b>🌿 우리의 교직 이야기</b><button class="soft" id="adminLogin">관리자 로그인</button></header><main><div class="eyebrow">NEW TEACHERS · BALANCE GAME</div><div id="error" class="error" role="alert"></div><div id="app"><h1>서로 다른 선택,<br>함께 나누는 이야기.</h1><p>학교와 이름을 입력하고 함께 시작해요.</p></div></main><dialog id="modal"><form id="reasonForm"><div class="eyebrow">한 줄 이야기</div><h2>이 선택을 한 이유는 무엇인가요?</h2><p id="picked"></p><label for="reason">간단히 한 줄로 적어주세요. 시간제한은 없어요.</label><textarea id="reason" maxlength="200" rows="3" required placeholder="실제로 겪었던 일이나 지금의 생각을 적어주세요."></textarea><div class="row"><small>최대 200자</small><button id="reasonSubmit">이유 등록하기</button></div></form></dialog><footer>정답은 없어요. 서로의 선택과 경험을 존중해주세요.</footer><dialog id="loginModal"><form id="loginForm"><h2>관리자 로그인</h2><p>Firebase에 등록한 관리자 계정으로 로그인하세요.</p><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><p id="loginError" role="alert"></p><div class="row"><button type="button" class="soft" id="loginClose">닫기</button><button id="loginSubmit">로그인</button></div></form></dialog><script type="module">

const firebaseConfig={apiKey:'AIzaSyAB-8wIbLAQgSLv24e82YIW8W7WQkK_McI',authDomain:'yoon-t.firebaseapp.com',projectId:'yoon-t',storageBucket:'yoon-t.firebasestorage.app',messagingSenderId:'44405483224',appId:'1:44405483224:web:98b8febedb9b9e6a3999ad'};
const firebase=initializeApp(firebaseConfig),auth=getAuth(firebase),db=getFirestore(firebase);
const ready=(async()=>{await setPersistence(auth,browserLocalPersistence);await auth.authStateReady();if(!auth.currentUser)await signInAnonymously(auth);})();

const Q=[["수업 중 더 당황스러운 상황은?", "질문이 끊이지 않는 학생들", "아무도 대답하지 않는 학생들"], ["더 긴장되는 첫 경험은?", "첫 공개수업", "첫 시험 출제"], ["둘 중 더 끌리는 선생님은?", "학생들에게 인기 많은 선생님", "동료 선생님들에게 인기 많은 선생님"], ["지금 더 어렵게 느껴지는 것은?", "수업 준비", "생활지도"], ["평가에서 더 어렵게 느껴지는 것은?", "시험 출제", "수행평가 설계"], ["학교생활에서 더 어렵게 느껴지는 것은?", "행정 업무", "동료 선생님들과의 소통"], ["업무를 잘 모를 때 더 부담스러운 것은?", "다른 선생님께 질문하기", "혼자 해결하려다 실수하기"], ["다음 연수에서 더 원하는 것은?", "교직 실무를 구체적으로 배우기", "교직생활의 고민을 함께 나누기"]];let room=new URLSearchParams(location.search).get('room'), me=localStorage.getItem('balance-person')||crypto.randomUUID(), state=null, pending=false, lastKey='', modalQ=null, offset=0;localStorage.setItem('balance-person',me);const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,data={}) {
  await ready;
  me=auth.currentUser.uid;
  if(action==='identity') {const a=await getDoc(doc(db,'admins',me));window.host=a.exists();return {host:window.host};}
  if(action==='create') {
    if(!window.host)throw Error('관리자 로그인이 필요합니다.');
    const r=doc(collection(db,'balanceRooms'));
    await setDoc(r,{phase:'lobby',q:0,seconds:20,deadline:0,hostUid:me,createdAt:serverTimestamp()});return {id:r.id};
  }
  const r=doc(db,'balanceRooms',room), member=doc(r,'people',me);
  if(action==='join') {const name=String(data.name||'').trim();if(!name||name.length>40)throw Error('학교와 이름을 40자 이내로 입력해주세요.');await setDoc(member,{name,uid:me});return {ok:true};}
  if(['start','results','next'].includes(action)) {
    await runTransaction(db,async tx=>{const snap=await tx.get(r);const s=snap.data();if(!s)throw Error('연수방을 찾을 수 없어요.');let update={};
      if(action==='start'&&s.phase==='lobby'){const seconds=Math.max(5,Math.min(120,Math.trunc(Number(data.seconds)||20)));update={phase:'vote',seconds,deadline:Timestamp.fromMillis(Date.now()+seconds*1000)};}
      else if(action==='results'&&s.phase==='vote')update={phase:'results'};
      else if(action==='next'&&s.phase==='results')update=s.q===7?{phase:'done'}:{phase:'vote',q:s.q+1,deadline:Timestamp.fromMillis(Date.now()+s.seconds*1000)};
      else throw Error('이미 화면이 변경되었어요.');tx.update(r,update);
    });return {ok:true};
  }
  if(action==='answer'){
    await setDoc(doc(r,'answers',data.q+'_'+me),{uid:me,q:data.q,choice:data.choice,reason:'',createdAt:serverTimestamp()});return {ok:true};
  }
  if(action==='reason'){const reason=String(data.reason||'').trim();if(!reason||reason.length>200)throw Error('이유를 1~200자로 입력해주세요.');await updateDoc(doc(r,'answers',data.q+'_'+me),{reason});return {ok:true};}
  if(action==='state'){
    const snap=await getDoc(r);if(!snap.exists())throw Error('연수방을 찾을 수 없어요.');const s=snap.data();
    const [peopleSnap,mineSnap,answerSnap]=await Promise.all([getDocs(collection(r,'people')),getDoc(member),getDoc(doc(r,'answers',s.q+'_'+me))]);
    const people=peopleSnap.docs.map(x=>({name:x.data().name})).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    let all=[];
    if(window.host||(mineSnap.exists()&&(s.phase==='results'||s.phase==='done'))) {
      const queryRef=s.phase==='done'?collection(r,'answers'):query(collection(r,'answers'),where('q','==',s.q));
      const votes=await getDocs(queryRef);const names=Object.fromEntries(peopleSnap.docs.map(x=>[x.id,x.data().name]));all=votes.docs.map(x=>({...x.data(),name:names[x.data().uid]||'참가자'}));
    }
    const current=all.filter(x=>x.q===s.q),answer=answerSnap.exists()?answerSnap.data():null;
    return {...s,deadline:s.deadline?.toMillis?s.deadline.toMillis():0,people,mine:mineSnap.exists()?mineSnap.data():null,now:Date.now(),answer,answers:s.phase==='results'?current:[],count:current.length,reasonCount:current.filter(x=>x.reason).length,summary:Array.from({length:8},(_,q)=>({a:all.filter(x=>x.q===q&&x.choice==='A').length,b:all.filter(x=>x.q===q&&x.choice==='B').length}))};
  }
  throw Error('잘못된 요청입니다.');
}
function error(e){const messages={'permission-denied':'권한이 없어요. firestore.rules 게시와 admins 관리자 UID 문서를 확인해주세요.','auth/admin-restricted-operation':'Firebase Authentication에서 익명 로그인을 사용 설정해주세요.','auth/operation-not-allowed':'Firebase Authentication 로그인 제공자를 사용 설정해주세요.','auth/unauthorized-domain':'Firebase Authentication 승인된 도메인에 GitHub Pages 주소를 추가해주세요.'};$('error').textContent=messages[e.code]||e.message;$('error').style.display='block'}function clearError(){$('error').style.display='none'}
async function init(){try{const d=await api('identity');window.host=d.host;if(!room){$('app').innerHTML='<h1>서로 다른 선택,<br>함께 나누는 이야기.</h1><p>진행자가 공유한 참가 링크로 입장해주세요.</p>'+(d.host?'<div class="panel"><h2>새 연수 시작하기</h2><p>참가 링크를 만들고 선생님들을 초대해요.</p><button id="create">연수방 만들기</button></div>':'<p>진행자라면 위의 관리자 로그인을 눌러주세요.</p>');if(d.host)$('create').onclick=async()=>{try{const x=await api('create');location.search='?room='+x.id}catch(e){error(e)}};return}await poll();setInterval(poll,1200);setInterval(tick,250)}catch(e){error(e)}}
let polling=false;async function poll(){if(pending||polling)return;polling=true;try{const d=await api('state');offset=d.now-Date.now();state=d;clearError();render()}catch(e){error(e)}finally{polling=false}}
function render(){const s=state;if(!s.mine){if(lastKey==='join')return;lastKey='join';$('app').innerHTML='<h1>반가워요, 선생님!</h1><p>학교와 이름을 입력하고 입장해주세요.</p><form id="join" class="panel"><label for="name">학교 · 이름</label><input id="name" maxlength="40" required placeholder="예: 매홀중 최윤정"><button>입장하기</button></form>';$('join').onsubmit=async e=>{e.preventDefault();try{await api('join',{name:$('name').value.trim()});lastKey='';poll()}catch(e){error(e)}};return}
const answer=s.answer,q=Q[s.q], key=JSON.stringify([s.phase,s.q,s.people,s.answers,answer,s.seconds,s.count,s.reasonCount]);if(lastKey===key){tick();return}lastKey=key;

else if(s.phase==='done'){html+='<h1>우리의 이야기는 계속됩니다.</h1><p>서로 다른 선택 속에서 비슷한 고민을 발견하셨나요?<br>함께 나눈 이야기를 다음 연수로 이어가요.</p><div class="panel"><h2>8개의 질문, 함께 나눈 선택</h2>'+s.summary.map((x,i)=>'<p><b>'+(i+1)+'. '+Q[i][0]+'</b><br>A '+x.a+'명 · B '+x.b+'명</p>').join('')+'</div>'}
else{html+='<div class="step">'+Q.map((_,i)=>'<span class="'+(i<=s.q?'on':'')+'"></span>').join('')+'</div><div class="row"><span class="eyebrow">QUESTION '+(s.q+1)+' / 8</span><span class="timer" id="timer"></span></div><h1>'+q[0]+'</h1>';
if(s.phase==='vote'){html+='<p>'+(s.q>=3?'먼저 선택하고, 이유는 시간제한 없이 작성해주세요.':'마음이 더 가는 쪽을 선택해주세요.')+'</p><div class="grid">'+['A','B'].map((c,i)=>'<button class="choice '+c.toLowerCase()+' '+(answer?.choice===c?'chosen':'')+'" data-choice="'+c+'" '+(answer?'disabled':'')+'><strong>OPTION '+c+'</strong>'+q[i+1]+'</button>').join('')+'</div><div class="panel" style="text-align:center">'+(answer?'선택을 등록했어요. 다른 선생님들의 선택을 기다려주세요.':'<span id="wait">선택 시간 안에 한 가지를 골라주세요.</span>')+(answer&&s.q>=3&&!answer.reason?'<br><button id="reopen">이유 작성하기</button>':'')+'</div>'}
else{const a=s.answers.filter(x=>x.choice==='A'),b=s.answers.filter(x=>x.choice==='B'),total=a.length+b.length;html+='<p>선택한 선생님 '+total+'명 · 미선택 '+(s.people.length-total)+'명</p><div class="row"><b>A '+a.length+'명 ('+(total?Math.round(a.length/total*100):0)+'%)</b><b>B '+b.length+'명 ('+(total?Math.round(b.length/total*100):0)+'%)</b></div><div class="bar">'+(total?'<div class="a" style="width:'+(a.length/total*100)+'%">'+(a.length?'A':'')+'</div><div class="b" style="width:'+(b.length/total*100)+'%">'+(b.length?'B':'')+'</div>':'<div style="width:100%;color:#68756b">아직 선택이 없어요</div>')+'</div><div class="grid">'+[a,b].map((list,i)=>'<div class="panel"><div class="eyebrow">OPTION '+(i?'B':'A')+'</div><h2>'+q[i+1]+'</h2>'+(s.q>=3?(list.length?list.map(x=>'<div class="reason"><small>'+esc(x.name)+'</small>'+esc(x.reason||'이유를 작성 중이에요.')+'</div>').join(''):'<p>아직 선택한 선생님이 없어요.</p>'):'<p>'+list.map(x=>esc(x.name)).join(' · ')+'</p>')+'</div>').join('')+'</div><p style="text-align:center">진행자가 다음 화면으로 이동할 때까지 기다려주세요.</p>';if(answer&&s.q>=3&&!answer.reason)html+='<button id="reopen">이유 작성하기</button>'}}
if(window.host){html+='<div class="admin"><div class="row"><b>진행자 화면</b><button class="soft" id="copy">참가 링크 복사</button></div>';if(s.phase==='lobby')html+='<label>선택 제한시간 (초) <input id="seconds" type="number" min="5" max="120" value="'+s.seconds+'"></label><button id="start">시작하기</button>';if(s.phase==='vote')html+='<p>선택 '+s.count+' / '+s.people.length+'명'+(s.q>=3?' · 이유 작성 완료 '+s.reasonCount+'명':'')+'</p><button id="results">결과 확인 · 모두에게 공유</button>';if(s.phase==='results')html+='<p>이유 작성 완료 '+s.reasonCount+' / '+s.count+'명</p><button id="next">'+(s.q===7?'게임 마무리':'다음 질문 · 모두 함께 이동')+'</button>';if(s.phase==='done')html+='<button id="createNext">새 연수방 만들기</button>';html+='</div>'}
$('app').innerHTML=html;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice));if($('reopen'))$('reopen').onclick=openReason;if($('copy'))$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('copy').textContent='복사했어요'}catch(e){error(Error('주소창의 링크를 복사해주세요.'))}};for(const action of ['start','results','next'])if($(action))$(action).onclick=async()=>{if(action==='next'&&s.q>=3&&s.reasonCount<s.count&&!confirm('아직 이유를 작성 중인 선생님이 있어요. 다음 질문으로 이동할까요?'))return;try{await api(action,{seconds:Number($('seconds')?.value||s.seconds)});lastKey='';poll()}catch(e){error(e)}};if($('createNext'))$('createNext').onclick=async()=>{try{let r=await api('create');location.search='?room='+r.id}catch(e){error(e)}};tick();}
function tick(){if(!state||state.phase!=='vote')return;const t=Math.max(0,Math.ceil((state.deadline-Date.now()-offset)/1000));if($('timer'))$('timer').textContent=t?t+'초':'선택 시간 종료';document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=!!state.answer||t===0||pending);if(!t&&$('wait'))$('wait').textContent='선택 시간이 끝났어요. 진행자의 결과 공유를 기다려주세요.'}

$('adminLogin').onclick=async()=>{await ready;if(!auth.currentUser.isAnonymous){if(confirm('관리자 계정에서 로그아웃할까요?')){await signOut(auth);location.reload();}return;}$('loginModal').showModal();};
$('loginClose').onclick=()=> $('loginModal').close();
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginSubmit').disabled=true;try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);const a=await getDoc(doc(db,'admins',auth.currentUser.uid));if(!a.exists()){await signOut(auth);await signInAnonymously(auth);throw Error('관리자 권한이 없습니다. Firestore의 admins 컬렉션에 이 계정 UID 문서를 추가해주세요.');}location.reload();}catch(e){$('loginError').textContent=e.code==='auth/invalid-credential'?'이메일과 비밀번호를 확인해주세요.':e.message;}finally{$('loginSubmit').disabled=false}};
ready.then(()=>{if(!auth.currentUser.isAnonymous)$('adminLogin').textContent='관리자 로그아웃';init();}).catch(error);

</script></html>
