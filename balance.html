    if(action==='closeRoom'){await updateDoc(r,{phase:'closed'});return {ok:true};}

    if(action==='deleteRoom'){await deleteCollection(collection(r,'people'));await deleteDoc(r);}
    else await updateDoc(r,{phase:'lobby',q:0,deadline:0});

      if(action==='start'&&s.phase==='lobby'){const seconds=Math.max(5,Math.min(120,Math.trunc(Number(data.seconds)||20)));update={phase:'vote',seconds,deadline:Timestamp.fromMillis(Date.now()+seconds*1000)};}

async function manageRoom(action,target){
  if(managing)return;
  const messages={clearRecords:'현재 방의 모든 선택과 이유를 삭제하고 대기 화면으로 돌아갈까요? 참가자 명단은 유지됩니다.',newRoom:'현재 게임을 종료하고 새 참가 코드로 방을 만들까요? 기존 기록은 보관됩니다.',deleteAndNew:'현재 방과 참가자·선택·이유를 모두 삭제하고 새 방을 만들까요? 삭제한 기록은 복구할 수 없습니다.',deleteRoom:'이 방의 참가자·선택·이유와 방 자체를 삭제할까요? 삭제한 기록은 복구할 수 없습니다.'};
  if(!confirm(messages[action]))return;
  managing=true;pending=true;while(polling)await new Promise(r=>setTimeout(r,40));if($('modal').open)$('modal').close();document.querySelectorAll('button').forEach(b=>b.disabled=true);
  try{
    if(action==='newRoom'||action==='deleteAndNew'){
      await api(action==='newRoom'?'closeRoom':'deleteRoom',{roomId:target});
      const created=await api('create');location.search='?room='+created.id;return;
    }
    await api(action,{roomId:target});
    if(action==='deleteRoom'){if(target===room)home();else await loadRooms();}
    else {lastKey='';pending=false;await poll();}
  }catch(e){error(e);lastKey='';}
  finally{managing=false;pending=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);tick();}
}
async function loadRooms(){
  if(!$('roomList'))return;
  try{const list=await api('listRooms');const labels={lobby:'대기 중',vote:'선택 진행 중',results:'결과 공유 중',done:'완료',closed:'종료',clearing:'기록 초기화 중'};
    $('roomList').innerHTML=list.length?list.map(r=>'<div class="old-room"><div><b>참가 코드 '+esc(r.id)+'</b><p>'+esc(labels[r.phase]||r.phase)+' · '+(r.createdAt?.toDate?esc(r.createdAt.toDate().toLocaleString('ko-KR')):'')+'</p></div><div class="row"><button class="soft" data-open-room="'+esc(r.id)+'">열기</button><button class="danger" data-delete-room="'+esc(r.id)+'">방·기록 삭제</button></div></div>').join(''):'<p>아직 만든 연수방이 없어요.</p>';
    document.querySelectorAll('[data-open-room]').forEach(b=>b.onclick=()=>location.search='?room='+encodeURIComponent(b.dataset.openRoom));
    document.querySelectorAll('[data-delete-room]').forEach(b=>b.onclick=()=>manageRoom('deleteRoom',b.dataset.deleteRoom));
  }catch(e){$('roomList').textContent='방 목록을 불러오지 못했어요. 새 보안 규칙을 게시했는지 확인해주세요.';error(e);}
}
function normalizeCode(value){return value.replace(/[０-９]/g,c=>String(c.charCodeAt(0)-0xFF10)).replace(/\s/g,'');}
async function init(){try{
  const d=await api('identity');window.host=d.host;
  if(!room){
    $('app').innerHTML='<h1>당신의 선택은?<br><span style="color:#8a61d5">교직 공감 밸런스게임!</span></h1><p>진행자가 알려준 6자리 참가 코드를 입력해주세요.</p><form id="codeForm" class="panel"><label for="roomCode">참가 코드</label><input id="roomCode" type="text" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="예: 123456" required style="font-size:28px;letter-spacing:6px"><p id="codeError" role="alert" style="color:#a33e32"></p><button id="codeSubmit">코드 확인 · 다음</button></form>'+(d.host?'<div class="panel"><h2>새 연수 시작하기</h2><p>6자리 참가 코드와 참가 링크를 만들고 선생님들을 초대해요.</p><button id="create">연수방 만들기</button></div><div class="panel"><h2>내 연수방 · 기존 기록 관리</h2><div id="roomList">방 목록을 불러오는 중이에요.</div></div>':'<p>진행자라면 위의 관리자 로그인을 눌러주세요.</p>');
    $('codeForm').onsubmit=async e=>{e.preventDefault();const code=normalizeCode($('roomCode').value);$('codeError').textContent='';if(!/^\d{6}$/.test(code)){$('codeError').textContent='참가 코드를 숫자 6자리로 입력해주세요.';$('roomCode').focus();return;}$('codeSubmit').disabled=true;try{await ready;const r=await getDoc(doc(db,'balanceRooms',code));if(!r.exists())throw Error('해당 코드의 연수방이 없어요. 진행자에게 코드를 확인해주세요.');if(['closed','clearing'].includes(r.data().phase))throw Error('종료되었거나 초기화 중인 방이에요. 진행자에게 새 코드를 확인해주세요.');location.search='?room='+code;}catch(e){$('codeError').textContent=e.code==='permission-denied'?'Firebase 보안 규칙을 확인해주세요.':e.message;$('codeSubmit').disabled=false;}};
    if(d.host)$('create').onclick=async()=>{$('create').disabled=true;try{const x=await api('create');location.search='?room='+x.id}catch(e){error(e);$('create').disabled=false;}};
    if(d.host)await loadRooms();
    return;
  }
  await poll();setInterval(poll,1200);setInterval(tick,250);
}catch(e){error(e)}}
let polling=false;async function poll(){if(pending||polling)return;polling=true;try{const d=await api('state');offset=d.now-Date.now();state=d;clearError();render()}catch(e){error(e)}finally{polling=false}}
function render(){const s=state;
if(['closed','clearing','removed'].includes(s.phase)){
  if($('modal').open)$('modal').close();document.body.classList.remove('rush');
  const k=s.phase+me;if(lastKey===k)return;lastKey=k;
  $('app').innerHTML='<div class="celebrate">'+(s.phase==='clearing'?'🧹':'🏁')+'</div><h1>'+(s.phase==='clearing'?'새 출발을 준비하고 있어요.':'이번 게임이 종료되었어요.')+'</h1><p>'+(s.phase==='clearing'?'진행자가 선택과 이유를 초기화하고 있어요. 잠시 기다려주세요.':'진행자에게 새 참가 코드를 확인하고 다시 입장해주세요.')+'</p><button id="backHome">참가 코드 입력 화면으로</button>'+(window.host&&s.phase!=='removed'?sharePanel():'');$('backHome').onclick=home;bindShare();bindManagement();return;
}
if(!s.mine&&!window.host){if(lastKey==='join:'+me)return;lastKey='join:'+me;$('app').innerHTML='<h1>반가워요, 선생님!</h1>'+(window.host?sharePanel():'<p>참가 코드를 확인했어요. 닉네임을 입력해주세요.</p>')+'<form id="join" class="panel"><label for="name">닉네임 (학교 · 이름)</label><input id="name" maxlength="40" required placeholder="예: 매홀중 최윤정"><button>입장하기</button></form>';bindShare();bindManagement();$('join').onsubmit=async e=>{e.preventDefault();try{await api('join',{name:$('name').value.trim()});lastKey='';poll()}catch(e){error(e)}};return}
const answer=s.answer,q=Q[s.q], key=JSON.stringify([s.phase,s.q,s.people,s.answers,answer,s.seconds,s.count,s.reasonCount]);if(lastKey===key){tick();return}lastKey=key;
if($('modal').open&&(modalQ!==s.q||s.phase==='done')){$('modal').close();modalQ=null}
let html=(window.host?sharePanel():'')+'<div class="row"><span class="chip">'+esc(window.host?'🎙 진행자':s.mine.name)+'</span><span>'+s.people.length+'명 입장</span></div>';
if(s.phase==='lobby'){html+='<h1>함께 시작할 준비를 하고 있어요.</h1><p>모두 입장하면 진행자가 게임을 시작합니다.<br>1~3번은 선택만, 4~8번은 선택 이유도 한 줄 나눠요.</p><div class="panel"><div class="count">'+s.people.length+'<small style="font-size:20px"> 명 입장</small></div><h2>지금 함께하는 선생님들</h2><div class="chips">'+s.people.map(x=>'<span class="chip">'+esc(x.name)+'</span>').join('')+'</div></div>'}
else if(s.phase==='done'){html+='<h1>우리의 이야기는 계속됩니다.</h1><p>서로 다른 선택 속에서 비슷한 고민을 발견하셨나요?<br>함께 나눈 이야기를 다음 연수로 이어가요.</p><div class="panel"><h2>8개의 질문, 함께 나눈 선택</h2>'+s.summary.map((x,i)=>'<p><b>'+(i+1)+'. '+Q[i][0]+'</b><br>A '+x.a+'명 · B '+x.b+'명</p>').join('')+'</div>'}
else{html+='<div class="step">'+Q.map((_,i)=>'<span class="'+(i<=s.q?'on':'')+'"></span>').join('')+'</div><div class="row"><span class="eyebrow">QUESTION '+(s.q+1)+' / 8</span><span class="timer" id="timer"></span></div><div class="time-track"><span id="timeFill"></span></div><div id="timerCaption" class="timer-caption"></div><h1>'+q[0]+'</h1>';
if(s.phase==='vote'){html+='<p>'+(window.host?'선생님들의 선택을 기다리고 있어요. 아래에서 결과를 공유할 수 있습니다.':s.q>=3?'먼저 선택하고, 이유는 시간제한 없이 작성해주세요.':'마음이 더 가는 쪽을 선택해주세요.')+'</p><div class="arena"><span class="versus">VS</span><div class="grid">'+['A','B'].map((c,i)=>'<'+(window.host?'div':'button')+' class="choice '+c.toLowerCase()+' '+(answer?.choice===c?'chosen':'')+'" data-option="'+c+'" '+(window.host?'':'data-choice="'+c+'" ')+(answer?'disabled':'')+'><strong>OPTION '+c+'</strong>'+q[i+1]+'</'+(window.host?'div':'button')+'>').join('')+'</div></div><div class="panel status-toast" style="text-align:center">'+(window.host?'진행자 전용 화면 · 참가자의 응답만 집계합니다.':answer?'선택을 등록했어요. 다른 선생님들의 선택을 기다려주세요.':'<span id="wait">선택 시간 안에 한 가지를 골라주세요.</span>')+(answer&&s.q>=3&&!answer.reason?'<br><button id="reopen">이유 작성하기</button>':'')+'</div>'}
else{const a=s.answers.filter(x=>x.choice==='A'),b=s.answers.filter(x=>x.choice==='B'),total=a.length+b.length;html+='<p>선택한 선생님 '+total+'명 · 미선택 '+(s.people.length-total)+'명</p><div class="row"><b>A '+a.length+'명 ('+(total?Math.round(a.length/total*100):0)+'%)</b><b>B '+b.length+'명 ('+(total?Math.round(b.length/total*100):0)+'%)</b></div><div class="bar">'+(total?'<div class="a" style="width:'+(a.length/total*100)+'%">'+(a.length?'A':'')+'</div><div class="b" style="width:'+(b.length/total*100)+'%">'+(b.length?'B':'')+'</div>':'<div style="width:100%;color:#68756b">아직 선택이 없어요</div>')+'</div><div class="grid">'+[a,b].map((list,i)=>'<div class="panel"><div class="eyebrow">OPTION '+(i?'B':'A')+'</div><h2>'+q[i+1]+'</h2>'+(s.q>=3?(list.length?list.map(x=>'<div class="reason"><small>'+esc(x.name)+'</small>'+esc(x.reason||'이유를 작성 중이에요.')+'</div>').join(''):'<p>아직 선택한 선생님이 없어요.</p>'):'<p>'+list.map(x=>esc(x.name)).join(' · ')+'</p>')+'</div>').join('')+'</div><p style="text-align:center">진행자가 다음 화면으로 이동할 때까지 기다려주세요.</p>';if(answer&&s.q>=3&&!answer.reason)html+='<button id="reopen">이유 작성하기</button>'}}
if(window.host){html+='<div class="admin"><div class="row"><b>진행자 화면</b></div>';if(s.phase==='lobby')html+='<label>선택 제한시간 (초) <input id="seconds" type="number" min="5" max="120" value="'+s.seconds+'"></label><button id="start">시작하기</button>';if(s.phase==='vote')html+='<p>선택 '+s.count+' / '+s.people.length+'명'+(s.q>=3?' · 이유 작성 완료 '+s.reasonCount+'명':'')+'</p><button id="results">결과 확인 · 모두에게 공유</button>';if(s.phase==='results')html+='<p>이유 작성 완료 '+s.reasonCount+' / '+s.count+'명</p><button id="next">'+(s.q===7?'게임 마무리':'다음 질문 · 모두 함께 이동')+'</button>';if(s.phase==='done')html+='<button id="createNext">새 연수방 만들기</button>';html+='</div>'}
$('app').innerHTML=html;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice));if($('reopen'))$('reopen').onclick=openReason;bindShare();for(const action of ['start','results','next'])if($(action))$(action).onclick=async()=>{if(action==='next'&&s.q>=3&&s.reasonCount<s.count&&!confirm('아직 이유를 작성 중인 선생님이 있어요. 다음 질문으로 이동할까요?'))return;try{await api(action,{seconds:Number($('seconds')?.value||s.seconds)});lastKey='';poll()}catch(e){error(e)}};if($('createNext'))$('createNext').onclick=()=>manageRoom('newRoom',room);bindManagement();tick();}
let timerStamp='';
function tick(){
  if(!state||state.phase!=='vote'){document.body.classList.remove('rush');return;}
  const t=Math.max(0,Math.ceil((state.deadline-Date.now()-offset)/1000)),timer=$('timer');
  if(timer){timer.textContent=t?'⏱ '+t:'선택 시간 종료';timer.classList.toggle('urgent',t>0&&t<=10);timer.classList.toggle('final-seconds',t>0&&t<=3);timer.classList.toggle('finished',t===0);const stamp=state.q+':'+t;if(stamp!==timerStamp){timerStamp=stamp;timer.classList.remove('pop');if(t>0&&t<=10){void timer.offsetWidth;timer.classList.add('pop');}}}
  document.body.classList.toggle('rush',t>0&&t<=10);
  if($('timeFill'))$('timeFill').style.width=Math.max(0,Math.min(100,(state.deadline-Date.now()-offset)/(state.seconds*1000)*100))+'%';
  if($('timerCaption'))$('timerCaption').textContent=t===0?'시간 종료! 이유는 계속 작성할 수 있어요.':t<=3?'마지막 순간! 당신의 선택은?':t<=10?'두근두근, 이제 선택해요!':'마음이 더 가는 쪽은 어디인가요?';
  document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=!!state.answer||t===0||pending);
  if(!t&&$('wait'))$('wait').textContent='선택 시간이 끝났어요. 진행자의 결과 공유를 기다려주세요.';
}
async function choose(choice){if(window.host||pending)return;pending=true;tick();try{await api('answer',{q:state.q,choice});pending=false;lastKey='';while(polling)await new Promise(r=>setTimeout(r,40));await poll();if(state.q>=3&&state.answer&&!state.answer.reason)openReason()}catch(e){pending=false;error(e);tick()}}
function openReason(){if(window.host)return;modalQ=state.q;$('picked').textContent=state.answer.choice+' · '+Q[state.q][state.answer.choice==='A'?1:2];$('reason').value='';$('modal').showModal();$('reason').focus()}
$('modal').addEventListener('cancel',e=>{e.preventDefault()});$('reasonForm').onsubmit=async e=>{e.preventDefault();$('reasonSubmit').disabled=true;try{await api('reason',{q:modalQ,reason:$('reason').value.trim()});$('modal').close();lastKey='';poll()}catch(e){error(e)}finally{$('reasonSubmit').disabled=false}};
$('adminLogin').onclick=async()=>{await ready;if(!auth.currentUser.isAnonymous){if(confirm('관리자 계정에서 로그아웃할까요?')){await signOut(auth);location.reload();}return;}$('loginModal').showModal();};
$('loginClose').onclick=()=> $('loginModal').close();
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginSubmit').disabled=true;try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);const a=await getDoc(doc(db,'admins',auth.currentUser.uid));if(!a.exists()){await signOut(auth);await signInAnonymously(auth);throw Error('관리자 권한이 없습니다. Firestore의 admins 컬렉션에 이 계정 UID 문서를 추가해주세요.');}location.reload();}catch(e){$('loginError').textContent=e.code==='auth/invalid-credential'?'이메일과 비밀번호를 확인해주세요.':e.message;}finally{$('loginSubmit').disabled=false}};
ready.then(()=>{if(!auth.currentUser.isAnonymous)$('adminLogin').textContent='관리자 로그아웃';init();}).catch(error);
